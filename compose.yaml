name: dispora-web

x-backend-env: &backend-env
  MONGO_URI: mongodb://${MONGO_APP_USER:-dispora_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/dispora?authSource=dispora
  MONGO_DB: dispora
  REDIS_URL: redis://redis:6379/0
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_TTL_DETAIL: ${CACHE_TTL_DETAIL:-3600}
  CACHE_TTL_LIST: ${CACHE_TTL_LIST:-300}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  TZ: Asia/Jakarta

services:
  mongo:
    build: ./mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: dispora
      MONGO_APP_USER: ${MONGO_APP_USER:-dispora_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      TZ: Asia/Jakarta
    # Published on localhost only, for mongosh / Compass while developing.
    ports:
      - "127.0.0.1:${MONGO_PORT:-57017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    build: ./redis
    # No host port: only the backend talks to Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # One-shot maintenance commands, e.g.
  #   docker compose run --rm worker ensure-indexes
  worker:
    build: ./backend
    entrypoint: ["python", "-m", "app.worker"]
    command: ["ping"]
    environment: *backend-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["tools"]

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
